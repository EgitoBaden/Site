<style>
  :root{
    --bg:#19120b;
    --bg-alt:#211710;
    --gold:#d4a94f;
    --gold-light:#f2ce85;
    --teal:#2f8f8a;
    --teal-light:#69c8c2;
    --terracotta:#c1653f;
    --ivory:#efe4cc;
    --muted:#b6a480;
    --border:rgba(212,169,79,0.22);
    --ease:cubic-bezier(.22,1,.36,1);
    --container:1040px;
    --lattice:
      repeating-linear-gradient(45deg, rgba(212,169,79,.05) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(-45deg, rgba(212,169,79,.05) 0 1px, transparent 1px 22px);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background-color:var(--bg);
    background-image:var(--lattice);
    color:var(--ivory);
    font-family:'EB Garamond',serif;
    font-size:1.08rem;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  img,svg{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:var(--container);margin:0 auto;padding:0 24px;}
  h1,h2,h3{font-family:'Cinzel',serif;letter-spacing:.5px;}
  .eyebrow{
    font-family:'Cinzel',serif;
    font-size:.72rem;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--teal-light);
    margin-bottom:10px;
    display:inline-block;
  }
  section h2{font-size:clamp(1.6rem,3.4vw,2.3rem);color:var(--gold-light);margin-bottom:16px;}
  .lede{color:var(--muted);max-width:560px;}

  /* ---------- reveal-on-scroll (one-time, cheap) ---------- */
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s var(--ease),transform .6s var(--ease);}
  .reveal.visible{opacity:1;transform:translateY(0);}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(25,18,11,.96);
    border-bottom:1px solid var(--border);
  }
  .nav-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 0;
    gap:20px;
  }
  .logo{display:flex;align-items:center;gap:10px;font-family:'Cinzel',serif;font-weight:700;font-size:1.2rem;color:var(--gold-light);}
  .logo-img{width:36px;height:36px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px var(--border),0 0 10px rgba(212,169,79,.25);}
  nav{display:flex;gap:4px;flex-wrap:wrap;}
  nav a{
    font-family:'Cinzel',serif;
    font-size:.78rem;
    letter-spacing:.6px;
    padding:8px 14px;
    border-radius:8px;
    color:var(--muted);
    transition:color .2s var(--ease),background-color .2s var(--ease);
  }
  nav a:hover,nav a:focus-visible{color:var(--gold-light);background:rgba(212,169,79,.08);outline:none;}
  nav a.active{color:var(--bg);background:var(--gold);}

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    padding:96px 0 80px;
    overflow:hidden;
    text-align:center;
    background:
      radial-gradient(ellipse 700px 420px at 20% 15%, rgba(212,169,79,.10), transparent 60%),
      radial-gradient(ellipse 700px 420px at 82% 85%, rgba(47,143,138,.10), transparent 60%),
      var(--bg);
  }
  .hero .eyebrow{margin-bottom:14px;}
  .hero h1{
    font-size:clamp(2.4rem,6vw,4rem);
    font-weight:700;
    background:linear-gradient(90deg,var(--gold),var(--gold-light),var(--gold));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    line-height:1.15;
  }
  .hero p.sub{
    max-width:520px;margin:18px auto 32px;
    color:var(--muted);font-size:1.15rem;
  }
  .hero-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn{
    font-family:'Cinzel',serif;font-size:.86rem;letter-spacing:.5px;
    padding:14px 30px;border-radius:999px;cursor:pointer;
    display:inline-flex;align-items:center;gap:10px;
    transition:transform .2s var(--ease),box-shadow .25s var(--ease),background-color .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease);
    border:1px solid transparent;
  }
  .btn:active{transform:translateY(0) scale(.98);}
  .btn-primary{background:var(--gold);color:#231a0e;}
  .btn-primary:hover,.btn-primary:focus-visible{transform:translateY(-2px);box-shadow:0 10px 24px rgba(212,169,79,.28);outline:none;}
  .btn-outline{background:transparent;border-color:var(--border);color:var(--ivory);}
  .btn-outline:hover,.btn-outline:focus-visible{border-color:var(--teal-light);color:var(--teal-light);transform:translateY(-2px);outline:none;}
  .btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;}

  /* static divider between hero and content — no animation needed */
  .divider{height:10px;background:repeating-linear-gradient(-45deg,var(--gold) 0 8px,transparent 8px 16px);opacity:.55;}

  /* ---------- generic section band ---------- */
  .band{padding:76px 0;}
  .band.alt{background-color:var(--bg-alt);background-image:var(--lattice);}
  .band-head{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .band-icon{
    width:46px;height:46px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,var(--gold-light),var(--gold));
    color:#231a0e;
  }
  .band-icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;}

  /* ---------- about (two column) ---------- */
  .about-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center;}
  .motif{
    aspect-ratio:1/1;border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(212,169,79,.22), transparent 55%),
      radial-gradient(circle at 68% 70%, rgba(47,143,138,.18), transparent 55%);
    border:1px solid var(--border);
    position:relative;
    max-width:280px;margin:0 auto;
  }
  .motif svg{width:56%;height:56%;position:absolute;top:22%;left:22%;color:var(--gold);opacity:.85;}

  /* ---------- hours ---------- */
  .hours-layout{display:flex;flex-wrap:wrap;gap:56px;align-items:flex-start;}
  .hours-grid{display:grid;grid-template-columns:auto 1fr;gap:10px 24px;font-size:1.15rem;margin-top:18px;}
  .hours-grid dt{color:var(--muted);}
  .hours-grid dd{color:var(--ivory);}
  .status-badge{
    display:inline-flex;align-items:center;gap:8px;margin-top:20px;
    padding:7px 16px;border-radius:999px;border:1px solid var(--border);
    font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.5px;
  }
  .status-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--teal-light);box-shadow:0 0 8px var(--teal-light);}
  .status-badge.closed .dot{background:var(--terracotta);box-shadow:0 0 8px var(--terracotta);}
  .status-badge.open{color:#9fdcd6;}
  .status-badge.closed{color:#e0ac96;}

  .clock{
    position:relative;width:110px;height:110px;flex-shrink:0;
    border:2px solid var(--gold);border-radius:50%;
    background:radial-gradient(circle at center,#2a2013 60%,#19120b 95%);
    box-shadow:inset 0 0 12px rgba(212,169,79,.28);
  }
  .hand{position:absolute;bottom:50%;left:50%;background:var(--gold);border-radius:4px;transform-origin:bottom center;}
  .hand.hour{width:4px;height:26px;margin-left:-2px;}
  .hand.min{width:3px;height:37px;margin-left:-1.5px;}
  .hand.sec{width:1.5px;height:46px;margin-left:-.75px;background:var(--gold-light);}
  .clock-dot{position:absolute;top:50%;left:50%;width:8px;height:8px;background:var(--gold-light);border-radius:50%;transform:translate(-50%,-50%);}

  /* ---------- contact ---------- */
  .contact-lines{margin-top:18px;display:grid;gap:8px;font-size:1.15rem;color:var(--ivory);}
  .contact-lines .label{color:var(--muted);font-size:.85rem;letter-spacing:.5px;text-transform:uppercase;font-family:'Cinzel',serif;margin-top:4px;}
  .socials{display:flex;gap:14px;margin-top:24px;}
  .socials a{
    width:42px;height:42px;border-radius:50%;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--gold);
    transition:transform .2s var(--ease),background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease);
  }
  .socials svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;}
  .socials a:hover,.socials a:focus-visible{background:var(--gold);color:#231a0e;border-color:var(--gold);transform:translateY(-3px);outline:none;}

  /* ---------- quick actions grid ---------- */
  .actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .action-card{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:16px;
    padding:32px 28px;
    transition:transform .25s var(--ease),border-color .25s var(--ease);
  }
  .action-card:hover{transform:translateY(-4px);border-color:var(--gold);}
  .action-card .band-icon{margin-bottom:16px;}
  .action-card h3{font-size:1.25rem;color:var(--gold-light);margin-bottom:8px;}
  .action-card p{color:var(--muted);margin-bottom:20px;font-size:1.02rem;}
  .action-card.ifood .band-icon{background:linear-gradient(145deg,#e08862,var(--terracotta));}
  .action-card.wifi .band-icon{background:linear-gradient(145deg,var(--teal-light),var(--teal));}

  /* ---------- footer ---------- */
  footer{
    border-top:1px solid var(--border);
    padding:40px 0;
    text-align:center;
    color:var(--muted);
    font-size:.92rem;
  }
  .footer-logo{width:46px;height:46px;border-radius:50%;object-fit:cover;opacity:.85;margin:0 auto 12px;display:block;box-shadow:0 0 0 1px var(--border);}

  /* ---------- back to top ---------- */
  #backToTop{
    display:none;position:fixed;bottom:22px;right:22px;
    width:46px;height:46px;border:none;border-radius:50%;
    background:var(--gold);color:#231a0e;cursor:pointer;z-index:20;
    align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
    transition:transform .2s var(--ease);
  }
  #backToTop:hover,#backToTop:focus-visible{transform:translateY(-3px);outline:none;}
  #backToTop svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;}

  button:focus-visible,a:focus-visible{outline:2px solid var(--gold-light);outline-offset:2px;}

  @media (max-width:820px){
    .about-grid{grid-template-columns:1fr;}
    .motif{order:-1;max-width:200px;}
    .actions-grid{grid-template-columns:1fr;}
  }
  @media (max-width:640px){
    .nav-row{flex-direction:column;align-items:flex-start;gap:10px;}
    nav{width:100%;justify-content:flex-start;}
    .band{padding:56px 0;}
    .hero{padding:64px 0 56px;}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
    .hero-scene,.hiero-frieze,.wave-row,.mini-wave,.mote,.lantern{display:none!important;}
  }

  /* ============ Egyptian foody enhancements ============ */

  /* subtle periodic glow pulse on the header logo */
  .logo-img{animation:logoGlow 6s ease-in-out infinite;}
  @keyframes logoGlow{
    0%,100%{box-shadow:0 0 0 1px var(--border),0 0 8px rgba(212,169,79,.2);}
    50%{box-shadow:0 0 0 1px var(--gold),0 0 16px rgba(212,169,79,.5);}
  }

  /* animated hieroglyph frieze divider (seamless scrolling row of glyph icons) */
  .hiero-frieze{
    overflow:hidden;height:30px;position:relative;opacity:.4;color:var(--gold);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
  }
  .hiero-track{display:flex;align-items:center;gap:36px;width:max-content;animation:friezeScroll 26s linear infinite;}
  .hiero-track svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;flex-shrink:0;}
  @keyframes friezeScroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}

  /* hero pyramid + sunrise motif */
  .hero{position:relative;}
  .hero .wrap{position:relative;z-index:1;}
  .hero-scene{
    position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
    width:min(560px,92%);color:var(--gold);opacity:.55;pointer-events:none;z-index:0;
  }
  .hero-scene .sun-rays{transform-origin:200px 66px;animation:raySpin 60s linear infinite;}
  .hero-scene .sun-core{fill:var(--gold-light);opacity:.5;animation:sunPulse 6s ease-in-out infinite;}
  @keyframes raySpin{to{transform:rotate(360deg);}}
  @keyframes sunPulse{0%,100%{opacity:.35;filter:drop-shadow(0 0 5px rgba(242,206,133,.3));}50%{opacity:.65;filter:drop-shadow(0 0 13px rgba(242,206,133,.5));}}

  /* flavor chips (About section) — gentle idle bob for a bit of life */
  .flavor-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;}
  .chip{
    display:inline-flex;align-items:center;gap:8px;padding:8px 15px;
    border:1px solid var(--border);border-radius:999px;
    font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.5px;color:var(--muted);
    transition:transform .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease),background-color .25s var(--ease);
    animation:chipBob 4.2s ease-in-out infinite;
  }
  .chip:nth-child(1){animation-delay:0s;}
  .chip:nth-child(2){animation-delay:.5s;}
  .chip:nth-child(3){animation-delay:1s;}
  .chip:nth-child(4){animation-delay:1.5s;}
  @keyframes chipBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  .chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;}
  .chip:hover{color:#231a0e;background:var(--gold);border-color:var(--gold);transform:translateY(-4px);animation-play-state:paused;}

  /* hanging lanterns flanking the header title */
  .lantern{width:26px;height:26px;color:var(--gold);transform-origin:50% 0%;flex-shrink:0;filter:drop-shadow(0 0 5px rgba(212,169,79,.3));}
  .lantern-left{animation:lanternSwayL 4.2s ease-in-out infinite;}
  .lantern-right{animation:lanternSwayR 4.6s ease-in-out infinite;}
  .lantern .lantern-flame{animation:flicker 2.2s ease-in-out infinite;transform-origin:12px 11px;}
  @keyframes lanternSwayL{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(4deg);}}
  @keyframes lanternSwayR{0%,100%{transform:rotate(6deg);}50%{transform:rotate(-4deg);}}

  /* food showcase strip (Menu section) — little illustrated dishes with idle life */
  .showcase-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:26px;}
  .dish{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:16px 14px;min-width:88px;
    border:1px solid var(--border);border-radius:14px;
    background:rgba(212,169,79,.04);
    transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease);
    animation:chipBob 5s ease-in-out infinite;
  }
  .dish:nth-child(1){animation-delay:0s;}
  .dish:nth-child(2){animation-delay:.4s;}
  .dish:nth-child(3){animation-delay:.8s;}
  .dish:nth-child(4){animation-delay:1.2s;}
  .dish:nth-child(5){animation-delay:1.6s;}
  .dish svg{width:30px;height:30px;color:var(--gold-light);stroke:currentColor;fill:none;stroke-width:1.5;}
  .dish span{font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.4px;color:var(--muted);text-align:center;}
  .dish:hover{transform:translateY(-5px) scale(1.04);border-color:var(--gold);box-shadow:0 8px 20px rgba(0,0,0,.35);animation-play-state:paused;}

  /* drifting spice motes — a few tiny specks of color for market-stall ambiance */
  .spice-motes{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .mote{position:absolute;border-radius:50%;opacity:.5;animation:moteDrift linear infinite;}
  @keyframes moteDrift{
    0%{transform:translateY(0) translateX(0);opacity:0;}
    10%{opacity:.55;}
    90%{opacity:.4;}
    100%{transform:translateY(-140px) translateX(18px);opacity:0;}
  }

  /* scarab accent beside the analog clock — symbol of renewal & time */
  .clock-wrap{position:relative;display:inline-block;}
  .scarab{
    position:absolute;top:-14px;right:-10px;width:30px;height:30px;
    color:var(--gold-light);opacity:.75;
    filter:drop-shadow(0 0 4px rgba(242,206,133,.35));
    animation:scarabSpin 20s linear infinite;
  }
